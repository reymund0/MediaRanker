services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mediarank_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-local-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U e2e -d mediarank_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
